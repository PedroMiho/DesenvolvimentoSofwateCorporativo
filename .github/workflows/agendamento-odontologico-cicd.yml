name: Agendamento Odontologico CI/CD

on:
  pull_request:
    paths:
      - "Aula03-DELETE/agendamento-odontologico/**"
      - ".github/workflows/agendamento-odontologico-cicd.yml"
      - "render.yaml"
  push:
    branches:
      - main
    paths:
      - "Aula03-DELETE/agendamento-odontologico/**"
      - ".github/workflows/agendamento-odontologico-cicd.yml"
      - "render.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agendamento-odontologico-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Testar e gerar pacote
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aula03-DELETE/agendamento-odontologico

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: Aula03-DELETE/agendamento-odontologico/pom.xml

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes e build
        run: ./mvnw --batch-mode clean verify

      - name: Validar construção da imagem
        run: docker build --tag agendamento-odontologico:${{ github.sha }} .

  deploy:
    name: Implantar no Render
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Acionar deploy hook do Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Secret RENDER_DEPLOY_HOOK_URL não configurado."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
